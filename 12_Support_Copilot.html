const _bci={};
function betaCI(a,b){

 let c=0,lo=null,hi=1;
 for(let i=0;i<N;i++){c+=w[i]/s;if(lo===null&&c>=0.025)lo=(i+1)/N;if(c>=0.975){hi=(i+1)/N;break}}
 return _bci[k]=[lo,hi];
}

// ===== 動態現場 L1：離散事件引擎（無 DOM；單位=分鐘；所有參數皆 E0 教學假設）=====
// 用法：const sim = SalonSim.create(cfg, opts); sim.advanceTo(T); sim.runAll(); sim.summary();
//   cfg  = {days, shifts, demand, staffById}
//   opts = {day, sched, waveMult, seed, params, absences:[{id,t}]}
// 同 seed + 同 day + 同 waveMult + 同 params => 同一批顧客（班表不同也一樣，可做 common random numbers）
const SalonSim = (function(){
  const OPEN_MIN = 720, SHIFT_MIN = 240;
  const DEFAULTS = {
    rhoTarget: 0.6,          // 校準（E0）：需求表的設計師數 = 工作量 ÷ (240 × 此值)，即留 40% 緩衝；0.8 時單設計師格等候爆量，見 findings.md

    pCancel: 0.08,           // 預約客取消率
    pCancelLate: 0.03,       // 其中「1 小時內才取消」（來不及補位），為 pCancel 的子集
    pNoShow: 0.06,           // 預約客 no-show
    pLate: 0.25,             // 預約客遲到機率
    lateMean: 12,            // 遲到分鐘（指數均值）
    lateDemote: true,        // 遲到 > lateDemoteMin 改排候補（失去預約優先權）
    lateDemoteMin: 15,
    priorityWin: 10,         // 預約時間前後 N 分鐘內享優先
    cv: 0.4,                 // 服務時間變異係數（對數常態）
    patWalk: {mean:40, sd:15, min:5},   // 現場客耐心（分鐘，截尾常態）
    patAppt: {mean:55, sd:15, min:10},  // 預約客耐心
    slack: 1,                // S1 → S2 之間最多多放幾位「已洗待剪」
    stylistSupport: false,   // 設計師是否可支援 S1/S3（無助理在班時一律自動支援）
    complaintBase: 0.02, complaintWait: 45, complaintAt45: 0.20, complaintSlope: 0.02, complaintLeave: 0.30,
    lossMargin: 0.7,         // L3 損失帳本（E0）：邊際貢獻率
    visitsPerYear: 4,        // 年回店次數（E0）
    pChurn: 0.2,             // 因這次離開而流失的機率（E0，保守）
    complaintCost: 200,      // 單件抱怨成本（E0：補償／負評）
    replaceOn: true,         // 替補折減：離開後 replaceWin 分鐘內 S2 無閒置＝產能未浪費，①不計；關＝上限估計
    replaceWin: 30,
    mix: [  // 服務組合（E0）：s1 洗護(助理) / s2 剪燙染(設計師，染燙取「動手分鐘」，藥劑等待不佔人) / s3 吹整結帳(助理)；price 供 L3 損失帳本
      {key:'wash',  label:'洗吹', p:0.25, s1:12, s2:15, s3:8,  price:500},
      {key:'cut',   label:'剪',   p:0.50, s1:12, s2:40, s3:10, price:900},
      {key:'color', label:'染燙', p:0.25, s1:20, s2:60, s3:15, price:3200}
    ]
  };

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function merge(base, over){
    const o = Object.assign({}, base);
    if(over) for(const k in over) o[k] = over[k];
    return o;
  }
  function mixMeans(P){
    let s1 = 0, s2 = 0, s3 = 0;
    P.mix.forEach(m => { s1 += m.p * m.s1; s2 += m.p * m.s2; s3 += m.p * m.s3; });
    return {s1, s2, s3};
  }
  // 每格期望：到店數（取消/no-show 前）、設計師/助理工作分鐘、換算需求人力（與員工板同單位）
  function expectedLoad(cfg, key, waveMult, params){
    const P = merge(DEFAULTS, params), mm = mixMeans(P), req = cfg.demand[key];
    const shrink = 1 - (P.pCancel + P.pNoShow) * P.apptShare;       // 實到比例
    const nBook = req[1] * SHIFT_MIN * P.rhoTarget / (mm.s2 * shrink) * (waveMult == null ? 1 : waveMult);
    const nReal = nBook * shrink;
    const workSty = nReal * mm.s2, workAst = nReal * (mm.s1 + mm.s3);
    return {nBook, nReal, workSty, workAst,
            needSty: workSty / (SHIFT_MIN * P.rhoTarget), needAst: workAst / (SHIFT_MIN * P.rhoTarget)};
  }

  // ---- 小工具：二元堆、常態、對數常態、Poisson ----
  function Heap(){
    const a = [];
    const lt = (x, y) => x.t < y.t || (x.t === y.t && x.n < y.n);
    return {
      get size(){ return a.length; },
      peek(){ return a[0]; },
      push(e){
        a.push(e); let i = a.length - 1;
        while(i > 0){ const p = (i - 1) >> 1; if(lt(a[i], a[p])){ const x = a[i]; a[i] = a[p]; a[p] = x; i = p; } else break; }
      },
      pop(){
        const top = a[0], last = a.pop();
        if(a.length){
          a[0] = last; let i = 0;
          for(;;){
            let l = 2 * i + 1, r = l + 1, m = i;
            if(l < a.length && lt(a[l], a[m])) m = l;
            if(r < a.length && lt(a[r], a[m])) m = r;
            if(m === i) break;
            const x = a[i]; a[i] = a[m]; a[m] = x; i = m;
          }
        }
        return top;
      }
    };
  }

  function create(cfg, opts){
    // n8n 補人：absences[i].bf>0 → 請假後 bf 分鐘由虛擬替補（同角色）補進同一班；替補只存在於本次模擬，不動頁面 staffById
    const bfSubs = {};
    (opts.absences || []).forEach(a => { if(a.bf > 0 && cfg.staffById[a.id]) bfSubs['BF_' + a.id] = {id: 'BF_' + a.id, name: 'n8n補人', role: cfg.staffById[a.id].role}; });

function liveReset(keepPlay, keepT){
  const was = LIVE.playing;
  livePause();
  const ev = evDay(LIVE.day);
  LIVE.sim = SalonSim.create({days, shifts, demand, staffById}, {day: LIVE.day, sched: currentSched, waveMult: waveMult, seed: LIVE.seed, force: DEM.force,
    params: EVT.params, absences: ev.absences, surges: ev.surges});
  if(keepT > 0) LIVE.sim.advanceTo(keepT);   // 事件注入後重建，並快轉回原時間（事件時間 ≥ 此刻，故此刻之前的歷史不變）
  LIVE.sig = lvSig(); LIVE.evSi = -1;
  lvNote(); lvRender(true); lvEvPanel();
  if(keepPlay && was) livePlay();
}
// L3 事件面板：請假（此刻、當班人員）／尖峰（此刻起 N 分鐘湧入 n 位現場客）／調參。全為 E0 教學假設
const EV_PARAMS = [['pCancel', '取消率 %', 100], ['pNoShow', 'no-show %', 100], ['pLate', '遲到率 %', 100], ['lossMargin', '邊際貢獻率 %', 100], ['pChurn', '回頭流失機率 %', 100], ['complaintCost', '抱怨成本 $', 1]];
function lvEvPanel(){
  const el = $('lvEvents'); if(!el || !LIVE.sim) return;
  const sim = LIVE.sim, t = Math.floor(sim.t), si = Math.min(shifts.length - 1, Math.floor(t / 240)), ev = evDay(LIVE.day), P = sim.params;
  LIVE.evSi = si;
  const gone = new Set(ev.absences.filter(a => Math.min(shifts.length - 1, Math.floor(a.t / 240)) === si).map(a => a.id));
  const crew = [...(currentSched[LIVE.day + '_' + shifts[si]] || [])].filter(id => staffById[id] && !gone.has(id));
  const who = crew.map(id => `<option value="${id}">${staffById[id].name}（${staffById[id].role === 'stylist' ? '設' : '助'}）</option>`).join('') || '<option value="">（此班無人）</option>';
  const chips = ev.absences.map((a, i) => `<span class="ev-chip">🤒 ${(staffById[a.id] || {}).name || a.id} ${lvHH(a.t)}${a.bf ? ' ＋補人' + a.bf + '分' : ''}<button data-k="abs" data-i="${i}" aria-label="移除">✕</button></span>`).join('')
    + ev.surges.map((g, i) => `<span class="ev-chip">🔥 +${g.n} ${lvHH(g.t0)}–${lvHH(g.t1)}<button data-k="sur" data-i="${i}" aria-label="移除">✕</button></span>`).join('');
  const pin = EV_PARAMS.map(([k, lb, mul]) => `<label>${lb} <input type="number" data-p="${k}" step="${mul === 1 ? 10 : 1}" min="0" max="${mul === 1 ? 5000 : 100}" value="${Math.round(P[k] * mul * 10) / 10}"></label>`).join('')
    + `<label><input type="checkbox" data-p="replaceOn"${P.replaceOn ? ' checked' : ''}> 替補折減（關＝損失上限估計）</label>`;
  el.innerHTML = `<b>事件注入</b>
    <label>🤒 請假 <select id="evWho">${who}</select></label><button class="btn" id="evAbs"${crew.length ? '' : ' disabled'}>此刻請假</button>
    <label title="預設不補；勾選後，之後按「此刻請假」會由 n8n 增量重排，指定分鐘後補一位同角色人員（E0 教學假設）"><input type="checkbox" id="evBf"${EVT.bf.on ? ' checked' : ''}> n8n 補人 <select id="evBfD">${[30, 45, 60, 90].map(m => `<option${m === EVT.bf.d ? ' selected' : ''}>${m}</option>`).join('')}</select> 分到位</label>
    <label>🔥 尖峰 <select id="evN"><option>6</option><option selected>10</option><option>15</option><option>20</option></select> 位 <select id="evDur"><option>30</option><option selected>60</option><option>90</option></select> 分</label><button class="btn" id="evSur">此刻湧入</button>
    ${chips}<button class="btn" id="evClr"${chips ? '' : ' disabled'}>清除事件</button>
    <details class="ev-params"><summary>調參（取消／no-show／遲到率與損失假設；皆為 E0，改完自動重跑到目前時間）</summary><div class="ev-grid">${pin}</div></details>`;
}
function evApply(){ const tt = LIVE.sim ? LIVE.sim.t : 0; liveReset(true, tt); }
function evWire(){
  const el = $('lvEvents');
  el.onclick = e => {
    const b = e.target.closest('button'); if(!b || !LIVE.sim) return;
    const ev = evDay(LIVE.day), t = Math.floor(LIVE.sim.t);
    if(b.id === 'evAbs'){ const id = $('evWho').value; if(id){ ev.absences.push(EVT.bf.on ? {id, t, bf: EVT.bf.d} : {id, t}); evApply(); } }
    else if(b.id === 'evSur'){ ev.surges.push({k: ++EVT.k, t0: t, t1: Math.min(719, t + (+$('evDur').value)), n: +$('evN').value}); evApply(); }
    else if(b.id === 'evClr'){ ev.absences = []; ev.surges = []; EVT.byDay[LIVE.day] = ev; evApply(); }
    else if(b.dataset.k){ (b.dataset.k === 'abs' ? ev.absences : ev.surges).splice(+b.dataset.i, 1); evApply(); }
  };
  el.onchange = e => {
    if(e.target.id === 'evBf'){ EVT.bf.on = e.target.checked; return; }
    if(e.target.id === 'evBfD'){ EVT.bf.d = +e.target.value; return; }
    const k = e.target.dataset && e.target.dataset.p; if(!k) return;
    if(k === 'replaceOn') EVT.params[k] = e.target.checked;
    else { const mul = (EV_PARAMS.find(x => x[0] === k) || [0, 0, 1])[2], v = parseFloat(e.target.value); if(!isFinite(v)) return; EVT.params[k] = Math.max(0, mul === 1 ? v : Math.min(100, v) / mul); }
    evApply();
  };
}
function livePlay(){
  if(!LIVE.sim) return;
  if(LIVE.sim.finished) { liveReset(false); }
  LIVE.playing = true; LIVE.lastTs = 0;
  const b = $('lvPlay'); if(b) b.textContent = '⏸ 暫停';
  requestAnimationFrame(liveLoop);
}
function livePause(){
  LIVE.playing = false;
  const b = $('lvPlay'); if(b) b.textContent = (LIVE.sim && LIVE.sim.finished) ? '↺ 再跑一次' : '▶ 播放';
}
function liveLoop(ts){
  if(!LIVE.playing || salonTab !== 'live') { if(salonTab !== 'live') livePause(); return; }
  if(!LIVE.lastTs) LIVE.lastTs = ts;
  const dt = Math.min(0.1, (ts - LIVE.lastTs) / 1000); LIVE.lastTs = ts;
  const sim = LIVE.sim;
  sim.advanceTo(sim.t + dt * LV_SPEEDS[LIVE.spd][1]);
  const done = sim.finished;
  lvRender(done || ts - LIVE.kpiAt > 250);
  if(done){ livePause(); return; }
  requestAnimationFrame(liveLoop);
}

function lvRender(withKpi){
  const sim = LIVE.sim, svg = $('lvDyn'); if(!sim || !svg) return;
  const t = sim.t, P = sim.params, st = sim.state(), C = sim.customers;
  const si = Math.min(shifts.length - 1, Math.floor(t / 240));
  const who = role => { const a = [...sim.crew[si].ids].map(id => staffById[id]).filter(s => s && s.role === role).map(s => s.name); return a.length ? a.join('、') : ''; };
  const sub = (x, y, txt, bad) => `<text class="lv-sub${bad ? ' bad' : ''}" x="${x}" y="${y}">${txt}</text>`;
  let h = '';
  // 標題
  const nA = who('assistant'), nS = who('stylist');
  h += `<text class="lv-ttl" x="80" y="68">等候區 · ${st.waiting.length} 人</text>`;
  h += `<text class="lv-ttl" x="335" y="68">S1 洗護</text>` + sub(335, 82, '助理：' + (nA || '（無人）'), !nA);
  h += `<text class="lv-ttl" x="480" y="68">待剪</text>`;
  h += `<text class="lv-ttl" x="565" y="68">S2 剪燙染</text>` + sub(565, 82, '設計師：' + (nS || '（無人）'), !nS);
  h += `<text class="lv-ttl" x="738" y="68">待吹</text>`;
  h += `<text class="lv-ttl" x="810" y="68">S3 吹整結帳</text>` + sub(810, 82, '助理：' + (nA || '（無人）'), !nA);

  const dot = (c, x, y, o) => {
    o = o || {};
    let s = `<g class="lv-dot lv-t${c.type}${c.appt ? '' : ' walk'}${o.gone ? ' gone' : ''}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"${o.op != null ? ` opacity="${o.op.toFixed(2)}"` : ''}>`;
    if(o.ring != null){ const f = Math.max(0, Math.min(1, o.ring)); s += `<circle class="lv-rt" r="13"/><circle class="lv-rf ${f > .5 ? 'lv-pg' : (f > .25 ? 'lv-pw' : 'lv-pb')}" r="13" stroke-dasharray="${(f * 81.68).toFixed(1)} 81.68" transform="rotate(-90)"/>`; }
    s += `<circle class="lv-body" r="9"/><text y="3.5">${(P.mix[c.type].label || '?')[0]}</text>`;
    if(c.complaint) s += `<text class="lv-bub" y="-15">💬</text>`;
    return s + '</g>';
  };
  // 等候區：前 6 位坐，其餘站
  st.waiting.forEach((c, i) => {
    const ring = 1 - (t - c.arrive) / c.patience;
    if(i < 6) h += dot(c, 92 + (i % 3) * 66, 104 + Math.floor(i / 3) * 58, {ring});
    else { const k = i - 6; if(k < 20) h += dot(c, 88 + (k % 10) * 21, 226 + Math.floor(k / 10) * 24, {ring}); }
  });
  if(st.waiting.length > 26) h += sub(250, 258, '+' + (st.waiting.length - 26) + ' 人');
  // 服務站
  const station = (x, w, n, list, tStart, dur, nobody) => {
    let s = '';
    const boxes = Math.min(3, Math.max(n, list.length, 1));
    for(let i = 0; i < boxes; i++) {
      const by = 96 + i * 54, c = list[i];
      s += `<rect class="lv-slot${c ? '' : (nobody && i === 0 ? ' none' : ' empty')}" x="${x}" y="${by}" width="${w}" height="44" rx="8"/>`;
      if(c){
        s += dot(c, x + 20, by + 22);
        const f = Math.max(0, Math.min(1, (t - tStart(c)) / dur(c)));
        s += `<rect class="lv-bar" x="${x + 38}" y="${by + 19}" width="${w - 50}" height="6" rx="3"/><rect class="lv-bar-f" x="${x + 38}" y="${by + 19}" width="${((w - 50) * f).toFixed(1)}" height="6" rx="3"/>`;
      }
    }
    if(list.length > 3) s += sub(x + 6, 262, '+' + (list.length - 3) + ' 人在做');
    return s;
  };
  const s1 = C.filter(c => c.state === 's1').sort((a, b) => a.t1 - b.t1);
  const s2 = C.filter(c => c.state === 'q2' && c.t2 != null).sort((a, b) => a.t2 - b.t2);
  const s3 = C.filter(c => c.state === 'q3' && c.t3 != null).sort((a, b) => a.t3 - b.t3);
  h += station(337, 116, st.cap.ast, s1, c => c.t1, c => c.s[0], st.cap.ast === 0);
  h += station(567, 146, st.cap.sty, s2, c => c.t2, c => c.s[1], st.cap.sty === 0);
  h += station(812, 121, st.cap.ast, s3, c => c.t3, c => c.s[2], st.cap.ast === 0);
  // 緩衝
  const buf = (x0, list) => { let s = ''; list.slice(0, 12).forEach((c, i) => { s += dot(c, x0 + (i % 2) * 28, 110 + Math.floor(i / 2) * 26); }); if(list.length > 12) s += sub(x0 - 6, 262, '+' + (list.length - 12)); return s; };
  h += buf(495, st.q2) + buf(752, st.q3);
  // 離店／離開（最近 30 分，淡出）
  const recent = (list, key) => list.filter(c => c[key] != null && t - c[key] <= 30).sort((a, b) => b[key] - a[key]);
  recent(C.filter(c => c.outcome === 'done'), 'tEnd').slice(0, 14).forEach((c, i) => { h += dot(c, 580 + i * 26, 330, {op: 1 - (t - c.tEnd) / 32}); });
  recent(C.filter(c => c.outcome === 'left'), 'tLeave').slice(0, 8).forEach((c, i) => { h += dot(c, 92 + i * 26, 330, {gone: true, op: 1 - (t - c.tLeave) / 32}); });
  // 班別時間軸
  const x0 = 70, W = 875, tt = Math.min(720, t);
  shifts.forEach((hh, i) => { h += `<rect class="lv-shift${i === si && t < 720 ? ' now' : ''}" x="${x0 + W * i / 3 + 1}" y="366" width="${W / 3 - 2}" height="20" rx="5"/><text class="lv-sub" x="${x0 + W * i / 3 + 8}" y="380">${shiftLabels[hh]}</text>`; });
  h += `<rect class="lv-prog" x="${x0}" y="362" width="${(W * tt / 720).toFixed(1)}" height="4" rx="2"/>`;
  svg.innerHTML = h;
  $('lvClock').textContent = lvHH(t);
  $('lvPhase').textContent = sim.finished && t >= 720 ? '今日結束' : (t >= 720 ? '打烊收尾' : '營業中');
  if(withKpi) lvKpi();
}

function lvKpi(){
  const sim = LIVE.sim, el = $('lvKPIs'); if(!sim || !el) return;
  LIVE.kpiAt = performance.now();
  const P = sim.params, C = sim.customers, st = sim.state(), s = sim.summary();
  const LG = sim.ledger(), pr = LG.rows.some(r => r.prov), pt = LG.parts, tot = LG.total || 1;
  if(LIVE.evSi !== Math.min(shifts.length - 1, Math.floor(sim.t / 240))) lvEvPanel();
  const lossTxt = e => { const r = e.kind === 'left' && LG.byId[e.id]; return r ? ' · 損失 $' + fmtMoney(r.total) + (r.prov ? '（暫估）' : '') : ''; };
  const seg = (cls, v, nm) => LG.total ? `<i class="${cls}" style="width:${(v / tot * 100).toFixed(1)}%" title="${nm} $${fmtMoney(v)}"></i>` : '';
  const lossCard = `<div class="skpi ${LG.total ? 'warn' : ''}"><small>累計離開損失（E0）${pr ? '・含暫估' : ''}</small><b>$${fmtMoney(LG.total)} <span>/ $${fmtMoney(LG.perHour)} 每小時</span></b>
      <div class="lossbar">${seg('l1', pt.m, '①當次邊際貢獻')}${seg('l2', pt.ret, '②回頭客流失')}${seg('l3', pt.cmp, '③抱怨')}${seg('l4', pt.sunk, '④沉沒成本')}</div>
      <span>① 當次 $${fmtMoney(pt.m)} · ② 回頭客 $${fmtMoney(pt.ret)} · ③ 抱怨 $${fmtMoney(pt.cmp)} · ④ 沉沒 $${fmtMoney(pt.sunk)}${pt.disc ? '　替補折減 −$' + fmtMoney(pt.disc) : ''}</span></div>`;
  const arrived = C.filter(c => c.state), done = arrived.filter(c => c.outcome === 'done'), left = arrived.filter(c => c.outcome === 'left');
  const waits = done.map(c => c.wait);
  const bad45 = arrived.length ? (done.filter(c => c.wait > P.complaintWait).length + left.length) / arrived.length : 0;
  const leaveRate = arrived.length ? left.length / arrived.length : 0;
  const cnt = k => sim.log.filter(e => e.kind === k).length;
  const complaints = C.filter(c => c.complaint).length;
  const inShop = arrived.length - done.length - left.length;
  const lvl = (v, a, b) => v <= a ? 'ok' : (v <= b ? 'warn' : 'bad');
  const mean = waits.length ? waits.reduce((x, y) => x + y, 0) / waits.length : 0;
  el.innerHTML = `
    <div class="skpi"><small>到店 / 完成 / 離開</small><b>${arrived.length} <span>/ ${done.length} / ${left.length}</span></b><span>店內 ${inShop} 人（等候 ${st.waiting.length}）· 今日計畫 ${s.planned} 位</span></div>
    <div class="skpi ${waits.length ? lvl(mean, 12, 20) : ''}"><small>等候（到店→開始剪燙染，扣自己洗護）</small><b>${waits.length ? mean.toFixed(1) : '—'} <span>分 · P90 ${waits.length ? lvPct(waits, .9).toFixed(0) : '—'}</span></b><span>以已完成 ${waits.length} 位計</span></div>
    <div class="skpi ${arrived.length ? lvl(leaveRate, .06, .12) : ''}"><small>離開率 / 等候&gt;${P.complaintWait} 分率</small><b>${(leaveRate * 100).toFixed(1)}% <span>/ ${(bad45 * 100).toFixed(1)}%</span></b><span>離開＝耐心耗盡</span></div>
    <div class="skpi ${complaints ? 'warn' : ''}"><small>抱怨 · 擾動事件（至今）</small><b>${complaints} <span>件抱怨</span></b><span>取消 ${cnt('cancel')} · no-show ${cnt('noshow')} · 遲到 ${cnt('late')} · 請假 ${cnt('absent')}</span></div>
    <div class="skpi ${lvl(s.utilSty, .75, .9)}"><small>設計師 / 助理 使用率</small><b>${(s.utilSty * 100).toFixed(0)}% <span>/ ${(s.utilAst * 100).toFixed(0)}%</span></b><span>以當下在班容量積分</span></div>${lossCard}`;
  const icon = {arrive: '🚪', left: '🚶', complaint: '💢', cancel: '✖', noshow: '👻', late: '⏰', absent: '🤒', shift: '🔔', close: '🌙', surge: '🔥'};
  const lg = sim.log.slice(-10).reverse();
  $('lvLog').innerHTML = `<b>最近事件</b>` + (lg.length ? lg.map(e => `<div><code>${lvHH(e.t)}</code> ${icon[e.kind] || '•'} ${e.id ? '#' + e.id + ' ' : ''}${e.msg}${lossTxt(e)}</div>`).join('') : '<div style="color:var(--mute)">尚無事件，按「播放」開始</div>');
}

/*__SALON_L5_BEGIN__*/
// ===== 動態現場 L5：決策試算計算層（純函式、無 DOM；CRN 配對；全部金額為 E0 假設）=====
// 用法：const E = makeL5({SalonSim, staff, staffById, days, shifts, demand}); E.drive(E.all(base, W)) 或用 generator 分片執行。
// 與 tests\salon_l5_headless.js 同邏輯（同種子＝同結果），供「決策試算」面板與無頭驗證共用。
function makeL5(env){
  const {SalonSim, staff, days, shifts, demand} = env;
  const cells = []; days.forEach(d => shifts.forEach(h => cells.push(d + '_' + h)));
  const A = {shiftH: 4, burden: 0.12, otMult: 1.34, wageNewAst: 180, wageNewSty: 250, weekMaxShifts: 10, dayMaxShiftsNoOT: 2, dayMaxShifts: 3};
  const SNACK_DELTA = 10, SNACK_CMP = 0.5, T95 = 2.045;
  const SB = Object.assign({}, env.staffById);
  cells.forEach(k => { SB['NA_' + k] = {id: 'NA_' + k, role: 'assistant', name: '新進兼職助理', cost: A.wageNewAst, isNew: true};
                       SB['NS_' + k] = {id: 'NS_' + k, role: 'stylist', name: '新進兼職設計師', cost: A.wageNewSty, isNew: true}; });
  const cfg = {days, shifts, demand, staffById: SB};
  const toBase = sched => { const b = {}; cells.forEach(k => b[k] = [...((sched || {})[k] || [])]); return b; };
  const clone = s => JSON.parse(JSON.stringify(s));
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const stat = a => { const n = a.length, m = mean(a); const sd = Math.sqrt(a.reduce((x, y) => x + (y - m) * (y - m), 0) / (n - 1)); const h = T95 * sd / Math.sqrt(n); return {n, mean: m, lo: m - h, hi: m + h}; };
  const verdict = s => s.lo > 0 ? '划算' : (s.hi < 0 ? '不划算' : (s.mean > 0 ? '持平(CI跨0)' : '持平偏負'));
  function runOne(day, seed, sched, snack, W){
    const s = SalonSim.create(cfg, {day, seed, sched, waveMult: W, snack: snack || null}); s.runAll();
    const P = s.params; let served = 0, ret = 0, cmp = 0;
    s.customers.forEach(c => {
      const contrib = P.mix[c.type].price * P.lossMargin;
      if(c.outcome === 'done'){ served += contrib; if(c.complaint) cmp += P.complaintCost; }
      else if(c.outcome === 'left'){ ret += P.visitsPerYear * contrib * P.pChurn; if(c.complaint) cmp += P.complaintCost; }
    });
    const sm = s.summary();
    return {profit: served - ret - cmp, served, ret, cmp, ledger: sm.lossTotal, left: sm.left, done: sm.done, waitMean: sm.waitMean, snackN: sm.snackN || 0};
  }
  const dayRuns = []; days.forEach(d => [1, 2, 3, 4, 5].forEach(sd => dayRuns.push([d, sd])));
  const seedsSel = Array.from({length: 30}, (_, i) => i + 1), seedsHold = Array.from({length: 30}, (_, i) => 101 + i);
  // ---- 方法 1：點心（30 營業日＝6 天×5 種子；Δ淨效益(cost)＝Δprofit − 份數×cost）----
  function* snackSweep(base, W){
    const Ts = [10, 15, 20, 25, 30], costs = [20, 40, 60], deltas = [5, 10, 15], out = {};
    const total = 1 + deltas.length * Ts.length; let k = 0;
    const baseRuns = dayRuns.map(([d, sd]) => runOne(d, sd, base, null, W)); yield ++k / total;
    const m1 = [];
    for(const delta of deltas) for(const T of Ts){
      const sn = {T, cost: 0, delta, cmpMult: SNACK_CMP};
      const rr = dayRuns.map(([d, sd]) => runOne(d, sd, base, sn, W));
      const dProfit = rr.map((r, i) => r.profit - baseRuns[i].profit), nSnack = rr.map(r => r.snackN);
      const dLedger = rr.map((r, i) => baseRuns[i].ledger - r.ledger), saved = rr.map((r, i) => baseRuns[i].left - r.left);
      if(T === 15 && delta === SNACK_DELTA) out.raw15 = {dProfit, nSnack};
      costs.forEach(cost => {
        const net = dProfit.map((v, i) => v - nSnack[i] * cost), netL = dLedger.map((v, i) => v - nSnack[i] * cost), st = stat(net);
        m1.push({T, cost, delta, net: st, verdict: verdict(st), netLedgerMean: mean(netL), snackN: mean(nSnack), savedLeavers: mean(saved),
                 costPerSaved: mean(saved) > 0 ? mean(nSnack) * cost / mean(saved) : null, breakevenCost: mean(nSnack) > 0 ? mean(dProfit) / mean(nSnack) : null});
      });
      yield ++k / total;
    }
    out.m1 = m1;
    out.baseline30 = {profitMean: mean(baseRuns.map(r => r.profit)), ledgerMean: mean(baseRuns.map(r => r.ledger)), leftMean: mean(baseRuns.map(r => r.left)), doneMean: mean(baseRuns.map(r => r.done))};
    return out;
  }
  // ---- 方法 2：加人（貪婪邊際分析；每步＝對「當天」的 Δ淨效益；選擇種子 1–30＋留出 101–130）----
  function* staffGreedy(base, W, maxSteps){
    maxSteps = maxSteps || 8;
    const out = {}, cur = clone(base);
    const weekShifts = id => cells.reduce((n, k) => n + (cur[k].includes(id) ? 1 : 0), 0);
    const dayShifts = (id, d) => shifts.reduce((n, h) => n + (cur[d + '_' + h].includes(id) ? 1 : 0), 0);
    const candidatesFor = () => {
      const L = [];
      cells.forEach(k => {
        const d = k.split('_')[0];
        ['NA_', 'NS_'].forEach(p => L.push({id: p + k, cell: k, day: d, isNew: true, role: SB[p + k].role, wage: SB[p + k].cost, valid: true, mult: 1, why: ''}));
        staff.forEach(s => {
          if(cur[k].includes(s.id)) return;
          const wk = weekShifts(s.id), dy = dayShifts(s.id, d);
          let valid = true, why = [], mult = 1;
          if(wk + 1 > A.weekMaxShifts){ valid = false; why.push('週工時>' + (A.weekMaxShifts * A.shiftH) + 'h'); }
          if(dy + 1 > A.dayMaxShifts){ valid = false; why.push('單日>12h'); }
          else if(dy + 1 > A.dayMaxShiftsNoOT) mult = A.otMult;
          L.push({id: s.id, cell: k, day: d, isNew: false, role: s.role, wage: s.cost, valid, mult, why: why.join('、')});
        });
      });
      return L;
    };
    const costOf = c => c.wage * A.shiftH * (1 + A.burden) * c.mult;
    const withCand = c => { const s = clone(cur); s[c.cell].push(c.id); return s; };
    const curRuns = {}; days.forEach(d => { curRuns[d] = seedsSel.map(sd => runOne(d, sd, cur, null, W)); }); yield 0.02;
    const evalCand = c => {
      const sc = withCand(c), cost = costOf(c), runs = seedsSel.map(sd => runOne(c.day, sd, sc, null, W));
      const dNet = runs.map((r, i) => r.profit - curRuns[c.day][i].profit - cost), dLed = runs.map((r, i) => curRuns[c.day][i].ledger - r.ledger - cost);
      return {c, cost, net: stat(dNet), netLedger: mean(dLed)};
    };
    const evalAll = function*(list, p0, p1){ const res = []; for(let i = 0; i < list.length; i++){ res.push(evalCand(list[i])); yield p0 + (p1 - p0) * (i + 1) / list.length; } return res; };
    const cand0 = candidatesFor();
    const round0 = yield* evalAll(cand0, 0.02, 0.4);
    out.round0 = round0.map(r => ({id: r.c.id, cell: r.c.cell, role: r.c.role, isNew: r.c.isNew, valid: r.c.valid, why: r.c.why, cost: r.cost, mean: r.net.mean, lo: r.net.lo, hi: r.net.hi, netLedger: r.netLedger}));
    const picks = []; let pool = round0.filter(r => r.c.valid);
    for(let step = 1; step <= maxSteps; step++){
      const p0 = 0.4 + 0.6 * (step - 1) / maxSteps, p1 = 0.4 + 0.6 * step / maxSteps;
      if(step > 1) pool = yield* evalAll(candidatesFor().filter(c => c.valid), p0, p1 - 0.01);
      if(!pool.length) break;
      pool.sort((a, b) => (Math.abs(b.net.mean - a.net.mean) < 1e-6 ? (a.c.isNew - b.c.isNew) : b.net.mean - a.net.mean));   // 同分優先用現有員工
      const best = pool[0];
      if(best.net.mean <= 0){ out.stopReason = '第 ' + step + ' 步最佳候選 ' + best.c.id + '@' + best.c.cell + ' 的 Δ淨效益 ' + best.net.mean.toFixed(0) + ' ≤ 0 → 停（邊際不划算）'; out.firstUnworthy = {id: best.c.id, cell: best.c.cell, mean: best.net.mean}; break; }
      const sc = withCand(best.c);
      const hold = seedsHold.map(sd => runOne(best.c.day, sd, sc, null, W).profit - runOne(best.c.day, sd, cur, null, W).profit - best.cost), hs = stat(hold);
      picks.push({step, id: best.c.id, cell: best.c.cell, role: best.c.role, isNew: best.c.isNew, cost: best.cost, mean: best.net.mean, lo: best.net.lo, hi: best.net.hi, verdict: verdict(best.net),
                  roi: best.net.mean / best.cost, hold: hs, holdVerdict: verdict(hs), netLedger: best.netLedger, runnerUp: pool.slice(1, 4).map(p => p.c.id + '@' + p.c.cell + ' ' + p.net.mean.toFixed(0))});
      cur[best.c.cell].push(best.c.id);
      curRuns[best.c.day] = seedsSel.map(sd => runOne(best.c.day, sd, cur, null, W));
      yield p1;
    }
    out.picks = picks; out.finalSched = cur;
    return out;
  }
  // ---- 組合：先加人再送點心（相對「已加人」；點心單價 40、取 m1 最佳 T）----
  function* combo(base, W, m1, finalSched){
    const bestSnack = m1.filter(r => r.cost === 40 && r.delta === SNACK_DELTA).sort((a, b) => b.net.mean - a.net.mean)[0];
    if(!bestSnack) return null;
    const sn = {T: bestSnack.T, cost: 0, delta: SNACK_DELTA, cmpMult: SNACK_CMP};
    const a = dayRuns.map(([d, sd]) => runOne(d, sd, finalSched, null, W)); yield 0.5;
    const b = dayRuns.map(([d, sd]) => runOne(d, sd, finalSched, sn, W)), baseRuns = dayRuns.map(([d, sd]) => runOne(d, sd, base, null, W));
    const net = b.map((r, i) => r.profit - a[i].profit - r.snackN * 40), st = stat(net);
    return {T: bestSnack.T, snackOnStaffed: st, verdict: verdict(st), staffedVsBase30gross: stat(dayRuns.map((_, i) => a[i].profit - baseRuns[i].profit)).mean};
  }
  function* all(sched, W){
    const base = toBase(sched), t0 = Date.now();
    const o1 = yield* (function*(){ const g = snackSweep(base, W); let r; while(!(r = g.next()).done) yield r.value * 0.2; return r.value; })();
    const o2 = yield* (function*(){ const g = staffGreedy(base, W); let r; while(!(r = g.next()).done) yield 0.2 + r.value * 0.75; return r.value; })();
    const cb = yield* combo(base, W, o1.m1, o2.finalSched);
    const out = Object.assign({W, assumptions: A, snackDelta: SNACK_DELTA, snackCmp: SNACK_CMP}, o1, o2); if(cb) out.combo = cb;
    out.secs = (Date.now() - t0) / 1000; yield 1; return out;
  }
  // 精簡結果（面板渲染用；也是內嵌快照格式）。數字四捨五入，節省體積。
  const rd = x => x == null ? null : Math.round(x * 10) / 10, rd2 = x => x == null ? null : Math.round(x * 100) / 100;
  function trim(o){
    const t = {W: o.W};
    if(o.m1) t.snack = {base: {profit: Math.round(o.baseline30.profitMean), left: rd2(o.baseline30.leftMean)},
      m1: o.m1.map(r => ({T: r.T, cost: r.cost, delta: r.delta, m: rd(r.net.mean), lo: rd(r.net.lo), hi: rd(r.net.hi), v: r.verdict, n: rd(r.snackN), sv: rd2(r.savedLeavers), be: rd(r.breakevenCost)}))};
    if(o.picks){
      const wr = role => { const a = o.round0.filter(r => r.isNew && r.role === role); return {avg: rd(mean(a.map(r => r.mean))), pos: a.filter(r => r.mean > 0).length, n: a.length}; };

      L5UI.snack = t.snack; if(mode === 'all'){ L5UI.staff = t.staff; L5UI.combo = t.combo || null; L5UI.src = 'live'; } else { L5UI.staff = null; L5UI.combo = null; L5UI.src = 'livesnack'; }

    <text x="${Wd - R}" y="${(Y(0) - 5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink)">0＝打平</text>

function spcPanelSvg(def, V){

  h += ttl(FZ.s1, 'S1 洗護', {t: `作業 ${s1.length}/${st.cap.ast}`, bad: st.cap.ast === 0}) + ttl(FZ.q2, `待剪 ${st.q2.filter(c => c.t2 == null).length}`);
  h += ttl(FZ.s2, 'S2 剪燙染', {t: `作業 ${s2.length}/${st.cap.sty}`, bad: st.cap.sty === 0}) + ttl(FZ.q3, `待吹 ${st.q3.filter(c => c.t3 == null).length}`);
  h += ttl(FZ.s3, 'S3 吹整結帳', {t: `作業 ${s3.length}/${st.cap.ast}`, bad: st.cap.ast === 0}) + ttl(FZ.out, '結帳離店', {t: '累計 ' + cum.out});
  h += `<text class="lv-ttl" x="${FZ.left.x + 8}" y="${FZ.left.y - 8}">離開（耐心耗盡）· 累計 ${cum.left}</text>`;
  // 💸 離開 = 機會成本損失（與動態現場、損失帳本同一本帳；E0 假設）
  const LG = sim.ledger(), LP = LG.parts, nProv = LG.rows.filter(r => r.prov).length, Z = FZ.loss, ly = FZ.left.y + FZ.left.h / 2;
  const big = [['當次貢獻', LP.m], ['回頭客流失', LP.ret], ['抱怨', LP.cmp]].sort((x, y) => y[1] - x[1])[0];
  h += `<path class="fl-edge gone" d="M${FZ.left.x + FZ.left.w + 4},${ly} H${Z.x - 6}" stroke-width="3" marker-end="url(#flArr)"/>`;
  h += `<text class="lv-ttl" x="${Z.x + 8}" y="${Z.y - 8}">💸 每位離開客＝機會成本損失（E0 假設）</text>`;
  h += `<text class="fl-loss-big" x="${Z.x + 14}" y="${Z.y + 36}">${LG.total > 0 ? '−' : ''}$${fmtMoney(LG.total)}</text>`;
  h += sub(Z.x + 190, Z.y + 22, `每營業小時 −$${fmtMoney(LG.perHour)}${cum.left ? ' · 平均每位離開 −$' + fmtMoney(LG.total / cum.left) : ''}`);
  h += sub(Z.x + 190, Z.y + 38, `當次 $${fmtMoney(LP.m)} · 回頭客流失 $${fmtMoney(LP.ret)} · 抱怨 $${fmtMoney(LP.cmp)}${nProv ? '（含 ' + nProv + ' 位暫估）' : ''}`);
  h += sub(Z.x + 14, Z.y + 62, LG.total > 0 ? `最大項：${big[0]}　→ 到「💰決策試算」看點心／加人划不划算` : '尚無離開客，損失 $0');
  [['s1', s1.length, st.cap.ast], ['s2', s2.length, st.cap.sty], ['s3', s3.length, st.cap.ast]].forEach(([k, used, cap]) => {
    const z = FZ[k]; for(let i = 0; i < Math.min(4, Math.max(cap, used, 1)); i++) h += `<rect class="lv-slot${i < used ? '' : (cap === 0 && i === 0 ? ' none' : ' empty')}" x="${z.x + 8}" y="${z.y + 32 + i * 46}" width="${z.w - 16}" height="38" rx="8"/>`;
  });
  if(over.wait) h += sub(FZ.wait.x + 8, FZ.wait.y + FZ.wait.h - 6, '+' + over.wait + ' 人');
  if(over.q2) h += sub(FZ.q2.x + 6, FZ.q2.y + FZ.q2.h - 6, '+' + over.q2);
  if(over.q3) h += sub(FZ.q3.x + 6, FZ.q3.y + FZ.q3.h - 6, '+' + over.q3);
  // 粒子
  T.forEach(o => {
    const p = o.p, c = o.c;
    if(p.tr.length > 1) h += `<polyline class="fl-trail lv-t${c.type}" points="${p.tr.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}" opacity="${((o.op || 1) * .4).toFixed(2)}"/>`;
    if(o.bar) h += `<rect class="lv-bar" x="${o.bar.x}" y="${o.bar.y}" width="${o.bar.w}" height="6" rx="3"/><rect class="lv-bar-f" x="${o.bar.x}" y="${o.bar.y}" width="${(o.bar.w * o.bar.f).toFixed(1)}" height="6" rx="3"/>`;
    if(o.gone && c.loss > 0) h += `<text class="fl-loss-pop" x="${(p.x - 14).toFixed(1)}" y="${(p.y + 24).toFixed(1)}"${o.op != null ? ` opacity="${Math.max(.5, o.op).toFixed(2)}"` : ''}>−$${fmtMoney(c.loss)}</text>`;
    h += `<g class="lv-dot lv-t${c.type}${c.appt ? '' : ' walk'}${o.gone ? ' gone' : ''}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"${o.op != null ? ` opacity="${o.op.toFixed(2)}"` : ''}>`;
    if(o.ring != null){ const f = Math.max(0, Math.min(1, o.ring)); h += `<circle class="lv-rt" r="12"/><circle class="lv-rf ${f > .5 ? 'lv-pg' : (f > .25 ? 'lv-pw' : 'lv-pb')}" r="12" stroke-dasharray="${(f * 75.4).toFixed(1)} 75.4" transform="rotate(-90)"/>`; }
    h += `<circle class="lv-body" r="8"/><text y="3.5">${(P.mix[c.type].label || '?')[0]}</text>${c.complaint ? '<text class="lv-bub" y="-13">💬</text>' : ''}</g>`;
  });
  dyn.innerHTML = h;
  if(ts - FL.kpiAt > 250){
    FL.kpiAt = ts;
    const inShop = st.waiting.length + s1.length + st.q2.length + st.q3.length;
    const waits = C.filter(c => c.outcome === 'done' && c.wait != null).map(c => c.wait), wm = waits.length ? waits.reduce((x, y) => x + y, 0) / waits.length : 0;
    const q = {'等候區': st.waiting.length, '待剪': st.q2.filter(c => c.t2 == null).length, '待吹': st.q3.filter(c => c.t3 == null).length};
    const top = Object.entries(q).sort((x, y) => y[1] - x[1])[0];
    $('flClock').textContent = lvHH(t);
    $('flK1').textContent = `在店 ${inShop} · 完成 ${cum.out} · 離開 ${cum.left}`;
    $('flK2').textContent = `平均等候 ${wm.toFixed(0)} 分 · 抱怨 ${C.filter(c => c.complaint).length}`;
    $('flK3').textContent = top[1] >= 4 ? `⚠ 瓶頸：${top[0]}（${top[1]} 人）` : '✔ 無壅塞';
    $('flK4').textContent = `💸 離開損失 −$${fmtMoney(LG.total)}`;
    $('flK3').style.color = top[1] >= 8 ? 'var(--bad)' : (top[1] >= 4 ? 'var(--warn)' : 'var(--ok)');
  }
}
/*__SALON_FLOW_END__*/
