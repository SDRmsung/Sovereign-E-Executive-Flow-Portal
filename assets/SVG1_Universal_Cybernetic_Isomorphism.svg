    <text x="1110" y="78" fill="#7ee787" font-size="13" font-weight="bold">🦾 ACT (行 / 能力層)</text>

    <!-- Row 1: Single Cell -->
    <text x="120" y="115" fill="#f0f6fc" font-size="12" font-weight="bold">🦠 單細胞生物 (草履蟲)</text>
    <text x="340" y="115" fill="#c9d1d9" font-size="12">化學感受器 (溫度/pH/葡萄糖)</text>
    <text x="590" y="115" fill="#c9d1d9" font-size="12">負熵穩態 (維持滲透壓/避毒)</text>
    <text x="850" y="115" fill="#c9d1d9" font-size="12">細胞訊號傳遞與趨化轉向</text>
    <text x="1110" y="115" fill="#c9d1d9" font-size="12">纖毛 / 偽足 (游向養分區)</text>
    <line x1="25" y1="130" x2="1275" y2="130" stroke="#21262d" stroke-width="1"/>

    <!-- Row 2: Human Brain -->
    <text x="120" y="155" fill="#f0f6fc" font-size="12" font-weight="bold">🧑 人類大腦 (神經認知)</text>
    <text x="340" y="155" fill="#c9d1d9" font-size="12">感官輸入與海馬迴情節記憶</text>
    <text x="590" y="155" fill="#c9d1d9" font-size="12">慾望、多巴胺、價值觀 (JTBD)</text>
    <text x="850" y="155" fill="#c9d1d9" font-size="12">前額葉皮質 (衝動抑制/超我)</text>
    <text x="1110" y="155" fill="#c9d1d9" font-size="12">骨骼肌、發聲器官 (語言/動作)</text>
    <line x1="25" y1="170" x2="1275" y2="170" stroke="#21262d" stroke-width="1"/>

    <!-- Row 3: Tesla FSD -->
    <text x="120" y="195" fill="#f0f6fc" font-size="12" font-weight="bold">🚗 自駕車 (Tesla FSD)</text>
    <text x="340" y="195" fill="#c9d1d9" font-size="12">LiDAR/視覺神經網/高精地圖</text>
    <text x="590" y="195" fill="#c9d1d9" font-size="12">導航終點與安全性 (碰撞率=0)</text>
    <text x="850" y="195" fill="#c9d1d9" font-size="12">MPC/CBF 屏障演算法與避障</text>
    <text x="1110" y="195" fill="#c9d1d9" font-size="12">轉向馬達/電子油門/線控煞車</text>
    <line x1="25" y1="210" x2="1275" y2="210" stroke="#21262d" stroke-width="1"/>

    <!-- Row 4: Missile -->
    <text x="120" y="235" fill="#f0f6fc" font-size="12" font-weight="bold">🚀 巡弋飛彈 / 無人機</text>
    <text x="340" y="235" fill="#c9d1d9" font-size="12">IMU 陀螺儀/GPS/尋標雷達</text>
    <text x="590" y="235" fill="#c9d1d9" font-size="12">目標座標 (命中碉堡/航程限制)</text>
    <text x="850" y="235" fill="#c9d1d9" font-size="12">卡爾曼濾波 / PID 姿態修正</text>
    <text x="1110" y="235" fill="#c9d1d9" font-size="12">伺服舵機 / 推力向量噴嘴</text>
    <line x1="25" y1="250" x2="1275" y2="250" stroke="#21262d" stroke-width="1"/>

    <!-- Row 5: AI Agent -->
    <rect x="25" y="255" width="1250" height="35" rx="4" fill="#1f242c" stroke="#388bfd" stroke-width="1"/>
    <text x="120" y="278" fill="#58a6ff" font-size="12" font-weight="bold">🤖 AI 代理人 (15大元素)</text>
    <text x="340" y="278" fill="#79c0ff" font-size="11" font-weight="bold">K1 Context / K2 Memory / K3 RAG</text>
    <text x="590" y="278" fill="#ff7b72" font-size="11" font-weight="bold">W1: Goal （Intent Contract）/W2/W3</text>
    <text x="850" y="278" fill="#d2a8ff" font-size="11" font-weight="bold">C1-C5+C6 LEDGER (Laya/Z3/OR-Tools)</text>
    <text x="1110" y="278" fill="#7ee787" font-size="11" font-weight="bold">A1 Tools / A2 Skills / A3 Plugin</text>

    <!-- Four Macro Breakdown Boxes -->
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="295" height="65" rx="8" fill="#21262d" stroke="#da3633" stroke-width="1.5"/>
      <text x="15" y="25" fill="#ff7b72" font-size="13" font-weight="bold">❌ 缺 WANT (欲) ➔【死物】</text>
      <text x="15" y="48" fill="#8b949e" font-size="11">如同石頭，無穩態需求任由風化消亡</text>

      <rect x="315" y="0" width="295" height="65" rx="8" fill="#21262d" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="330" y="25" fill="#79c0ff" font-size="13" font-weight="bold">❌ 缺 KNOW (知) ➔【盲人】</text>
      <text x="330" y="48" fill="#8b949e" font-size="11">看不見懸崖火源，邁出第一步即自毀</text>

      <rect x="630" y="0" width="295" height="65" rx="8" fill="#21262d" stroke="#238636" stroke-width="1.5"/>
      <text x="645" y="25" fill="#7ee787" font-size="13" font-weight="bold">❌ 缺 ACT (行) ➔【植物人】</text>
      <text x="645" y="48" fill="#8b949e" font-size="11">感知危險且有求生欲，但無法物理干預</text>

      <rect x="945" y="0" width="295" height="65" rx="8" fill="#21262d" stroke="#8957e5" stroke-width="1.5"/>
      <text x="960" y="25" fill="#d2a8ff" font-size="13" font-weight="bold">❌ 缺 CONTROL (制) ➔【瘋子】</text>
      <text x="960" y="48" fill="#8b949e" font-size="11">有目標有力氣但無煞車，瞬間震盪自毀</text>
    </g>
  </g>

  <!-- Cross-Domain Validation Footer -->
  <g transform="translate(50, 970)">
    <rect x="0" y="0" width="1300" height="95" rx="10" fill="#161b22" stroke="#f778ba" stroke-width="2"/>
    <text x="20" y="27" fill="#f778ba" font-size="15" font-weight="bold">🧬 跨案例佐證：VikingRAG Experience Edge 驗證同一閉環動力學</text>
    <text x="20" y="50" fill="#c9d1d9" font-size="12">狀態反饋 St ↔ Experience Edge ε(v→u) 軌跡持久化；策略指令 at ↔ sim(Q',Q)≥γ 費洛蒙啟動；已在文件檢索領域實測：Token 省 67%-95%（arXiv:2609.11390）。</text>
    <text x="20" y="73" fill="#8b949e" font-size="11">詳見：A03 02_Tech_VikingRAG核心原理與經驗邊架構規格.md §十 · A43 SKILL-STATE-Complete-Notes.md §7-8</text>
  </g>
</svg>