  <!-- Header -->
  <rect x="40" y="25" width="1320" height="75" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="58" fill="#f0f6fc" font-size="21" font-weight="bold" text-anchor="middle">SVG 1: 萬物控制論同構與最小因果閉環公理 (15 大元素 ✕ 五大引擎流水線工序)</text>
  <text x="700" y="82" fill="#8b949e" font-size="12" text-anchor="middle">15 Elements: KNOW(K1-K3) → CONTROL(C1-C5+C6 LEDGER) ← WANT(W1-W3) ⟹ ACT(A1-A3) | Laya/Jev ➔ Intent Eng ➔ Kahn DAG ➔ Z3 ➔ OR-Tools</text>

  <!-- Central Cybernetic Loop Diagram -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1300" height="380" rx="12" fill="url(#grad-card)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="35" fill="#58a6ff" font-size="16" font-weight="bold">🏛️ 一、 最小因果封閉系統核心動力學閉環 (Minimal Closed Dynamic Loop)</text>

    <!-- 1. KNOW Block -->
    <g transform="translate(80, 70)">
      <rect x="0" y="0" width="250" height="120" rx="10" fill="url(#grad-know)" stroke="#58a6ff" stroke-width="2"/>
      <text x="125" y="32" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">🧠 1. KNOW (知 / 世界模型)</text>
      <text x="125" y="56" fill="#e6edf3" font-size="12" text-anchor="middle">餵什麼：感知輸入、內部狀態</text>
      <text x="125" y="76" fill="#e6edf3" font-size="12" text-anchor="middle">單體必備，多智能體則分散下放</text>
      <text x="125" y="100" fill="#79c0ff" font-size="12" font-weight="bold" text-anchor="middle">[K1 Context / K2 Memory / K3 RAG]</text>
    </g>

    <!-- 2. WANT Block -->
    <g transform="translate(80, 230)">
      <rect x="0" y="0" width="250" height="120" rx="10" fill="url(#grad-want)" stroke="#f85149" stroke-width="2"/>
      <text x="125" y="30" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">🎯 2. WANT (欲 / 意志動機)</text>
      <text x="125" y="52" fill="#e6edf3" font-size="12" text-anchor="middle">要什麼：W1 意圖契約化 (唯一本體)</text>
      <text x="125" y="72" fill="#ffd600" font-size="11" font-weight="bold" text-anchor="middle">六族契約代碼：圖➔足➔割➔分➔裝➔跑</text>
      <text x="125" y="94" fill="#e6edf3" font-size="11" text-anchor="middle">怎麼想：W2 Prompt / W3 Reasoning</text>
      <text x="125" y="112" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle">[W1: Goal （Intent Contract） / W2 / W3]</text>
    </g>

    <!-- 3. CONTROL Block (Central Engine) -->
    <g transform="translate(510, 100)">
      <rect x="0" y="0" width="280" height="220" rx="12" fill="url(#grad-ctrl)" stroke="#bc8cff" stroke-width="2.5"/>
      <text x="140" y="30" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">🛡️ 3. CONTROL (制 / 治理中樞)</text>
      <line x1="20" y1="42" x2="260" y2="42" stroke="#d2a8ff" stroke-width="1" opacity="0.5"/>
      <text x="140" y="62" fill="#f0f6fc" font-size="12" text-anchor="middle">怎麼管：C1-C5 + C6 LEDGER 帳本</text>
      <text x="140" y="82" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">⚡ 五大引擎流水線工序：</text>
      <text x="140" y="100" fill="#e6edf3" font-size="11" text-anchor="middle">Laya/Jev 快判 (30ms 分流/防越獄)</text>
      <text x="140" y="118" fill="#e6edf3" font-size="11" text-anchor="middle">Intent Eng 提純 ➔ Kahn DAG 編排</text>
      <text x="140" y="136" fill="#ffd600" font-size="11" font-weight="bold" text-anchor="middle">Z3 (合規/死鎖/門禁) ✕ OR-Tools (算術/排程)</text>
      <text x="140" y="156" fill="#f0f6fc" font-size="11" text-anchor="middle">DecisionGateway 依信心升級 Reflection</text>
      <rect x="15" y="172" width="250" height="38" rx="6" fill="#161b22"/>
      <text x="140" y="196" fill="#ffd600" font-size="11" font-weight="bold" text-anchor="middle">C1-C5 + C6 LEDGER (對帳/追責/防重)</text>
    </g>

    <!-- 4. ACT Block -->
    <g transform="translate(960, 150)">
      <rect x="0" y="0" width="260" height="120" rx="10" fill="url(#grad-act)" stroke="#3fb950" stroke-width="2"/>
      <text x="130" y="32" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">🦾 4. ACT (行 / 能力效應器)</text>
      <text x="130" y="56" fill="#e6edf3" font-size="12" text-anchor="middle">能做什麼：Tool Use / ReAct 重度依賴</text>
      <text x="130" y="76" fill="#8b949e" font-size="11" text-anchor="middle">Reflection / Planning 幾乎不碰</text>
      <text x="130" y="102" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">[A1 Tools / A2 Skills / A3 Plugin]</text>
    </g>

    <!-- Arrows connecting the 4 pillars -->
    <path d="M 330 130 Q 420 130 500 170" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="410" y="140" fill="#79c0ff" font-size="12" font-weight="bold">狀態反饋 St</text>

    <path d="M 330 290 Q 420 290 500 240" fill="none" stroke="#f85149" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="410" y="280" fill="#ff7b72" font-size="12" font-weight="bold">目標理想態 S*</text>

    <path d="M 790 210 L 950 210" fill="none" stroke="#bc8cff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="870" y="198" fill="#d2a8ff" font-size="12" font-weight="bold" text-anchor="middle">策略指令 at</text>

    <!-- Feedback loop to KNOW -->
    <path d="M 1090 270 C 1090 350, 205 390, 205 200" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
    <text x="650" y="365" fill="#7ee787" font-size="13" font-weight="bold" text-anchor="middle">物理環境擾動反饋 ➔ 形成感知閉環 (Closed-Loop Free Energy Minimization)</text>
  </g>

  <!-- Cross-Domain Isomorphism Table -->
  <g transform="translate(50, 525)">
